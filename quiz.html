<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phishing-quiz – Link Check</title>
  <link rel="icon" href="icons/icon32.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: "Segoe UI", Arial, sans-serif; color: #e8f4fa;
      background: radial-gradient(circle at 50% 20%, #16314a 0%, #0b1626 70%);
      display: flex; flex-direction: column; align-items: center; padding: 48px 20px;
    }
    .logo { width: 80px; filter: drop-shadow(0 0 18px rgba(63, 230, 255, 0.45)); }
    h1 { font-size: 2rem; margin: 12px 0 4px; }
    .tagline { color: #9fc3d6; margin: 0 0 28px; text-align: center; }
    .card {
      width: 100%; max-width: 600px; background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(63, 230, 255, 0.25); border-radius: 16px; padding: 24px;
    }
    #taeller { color: #9fc3d6; font-size: 0.9rem; }
    #type { margin: 14px 0 6px; font-weight: 600; color: #c4e7f5; }
    #opgave {
      padding: 14px 16px; border-radius: 10px; background: #0e2034; border: 1px solid #2c4a63;
      font-family: Consolas, monospace; overflow-wrap: anywhere; line-height: 1.5; white-space: pre-wrap;
    }
    .knapper { display: flex; gap: 12px; margin-top: 18px; }
    .knapper button, #naeste, #igen {
      flex: 1; padding: 12px; font-size: 1rem; font-weight: 600; border: none; border-radius: 10px; cursor: pointer;
    }
    #sikker { background: #2e8b57; color: white; }
    #phishing { background: #c0392b; color: white; }
    .knapper button:disabled { opacity: 0.4; cursor: default; }
    #svar { margin-top: 16px; padding: 14px; border-radius: 10px; color: #10202e; line-height: 1.5; }
    #svar:empty { display: none; }
    #naeste, #igen { margin-top: 14px; width: 100%; background: #1a9ec2; color: white; }
    #slut { text-align: center; }
    #point { font-size: 3rem; font-weight: 700; margin: 8px 0; }
    a { color: #c4fcff; }
    .note { margin-top: 24px; font-size: 0.85rem; color: #7fa2b6; text-align: center; max-width: 600px; }
  </style>
</head>
<body>
  <img class="logo" src="icons/logo.svg" alt="">
  <h1>Phishing-quiz</h1>
  <p class="tagline">Kan du se forskel på ægte links og phishing? 10 spørgsmål.</p>

  <div class="card" id="quiz">
    <div id="taeller"></div>
    <div id="type"></div>
    <div id="opgave"></div>
    <div class="knapper">
      <button id="sikker">✅ Sikker</button>
      <button id="phishing">🎣 Phishing</button>
    </div>
    <div id="svar"></div>
    <button id="naeste" hidden>Næste →</button>
  </div>

  <div class="card" id="slut" hidden>
    <div>Du fik</div>
    <div id="point"></div>
    <div id="vurdering"></div>
    <button id="igen">Prøv igen</button>
  </div>

  <p class="note">Alle phishing-adresser i quizzen er opdigtede eksempler. <a href="index.html">← Tilbage til Link Check</a> · <a href="hvorfor.html">Læs om advarselstegnene</a><br>Lavet af <a href="https://github.com/vindfoxy-alt">vindfoxy-alt</a></p>

  <script src="quiz.js"></script>
</body>
</html>
